aid: circle-asia
name: Circle Asia
description: >-
  Circle Asia Technologies is a Singapore-headquartered consumer fintech (offices
  at 68 Circular Road, Singapore, and Ho Chi Minh City, Vietnam) behind the Circle
  app and the VPBank Circle PayLater credit card, a digital buy-now-pay-later card
  issued in partnership with Vietnam Prosperity Joint Stock Commercial Bank (VPBank).
  The product lets consumers onboard with only an ID and phone number, waives the
  lifetime annual fee, and pairs a physical and virtual card with AI-assisted expense
  management, spending limits, one-tap card lock, biometric (face/fingerprint)
  authentication, and real-time SMS/app transaction alerts. The company is PCI DSS
  v4.0.1 certified and Visa-compliant, ships native iOS and Android apps, and is
  backed by 500 Global. Circle Asia is a consumer application company with no public
  developer API; this profile captures its identity, security posture, and
  compliance claims for the API Evangelist network.
